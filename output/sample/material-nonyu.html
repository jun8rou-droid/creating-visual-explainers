<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>（有）日勝ネジ 材料ポータル</title>
  <style>
    :root {
      --bg: #f4f6f9;
      --card: #ffffff;
      --border: #d7dde6;
      --text: #1c2430;
      --muted: #64748b;
      --blue: #2563eb;
      --blue-dark: #1d4ed8;
      --green: #15803d;
      --red: #b91c1c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Hiragino Sans", "Yu Gothic UI", "Meiryo", sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 16px;
      line-height: 1.6;
    }
    .wrap { max-width: 760px; margin: 0 auto; padding: 16px 12px 60px; }
    h1 { font-size: 20px; margin: 8px 0 2px; }
    .sub { color: var(--muted); font-size: 13px; margin-bottom: 14px; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 1px 3px rgba(15, 23, 42, .06);
    }
    label { font-size: 13px; color: var(--muted); display: block; margin-bottom: 4px; }
    input, select {
      width: 100%;
      font-size: 17px;
      padding: 10px 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #fff;
      color: var(--text);
    }
    input:focus, select:focus { outline: 2px solid var(--blue); outline-offset: 0; border-color: var(--blue); }
    .rows { display: flex; flex-direction: column; gap: 12px; }
    .row-card {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      background: #fafbfd;
    }
    .row-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .row-no { font-weight: 700; font-size: 14px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .grid .full { grid-column: 1 / -1; }
    .kg { font-size: 12px; color: var(--muted); margin-top: 6px; min-height: 16px; }
    .btn {
      display: inline-block;
      border: none;
      border-radius: 10px;
      padding: 12px 18px;
      font-size: 16px;
      cursor: pointer;
      font-weight: 600;
    }
    .btn-primary { background: var(--blue); color: #fff; width: 100%; padding: 16px; font-size: 18px; }
    .btn-primary:active { background: var(--blue-dark); }
    .btn-primary:disabled { background: #94a3b8; cursor: default; }
    .btn-sub { background: #e2e8f0; color: var(--text); font-size: 14px; padding: 10px 14px; }
    .btn-del { background: none; border: none; color: var(--red); font-size: 13px; cursor: pointer; padding: 4px; }
    .msg-ok { color: var(--green); font-weight: 700; }
    .msg-err { color: var(--red); font-weight: 600; white-space: pre-wrap; }
    .done-card { border: 2px solid var(--green); }
    .done-title { color: var(--green); font-size: 18px; font-weight: 700; margin-bottom: 6px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { padding: 6px 4px; border-bottom: 1px solid var(--border); text-align: left; white-space: nowrap; }
    th { color: var(--muted); font-weight: 600; }
    td.num, th.num { text-align: right; }
    .hist-scroll { overflow-x: auto; }
    .hidden { display: none !important; }
    .center { text-align: center; padding: 40px 10px; color: var(--muted); }
    /* 発注＝青／見積依頼＝オレンジ で見分けやすく */
    .ord-order { border-left: 6px solid var(--blue); }
    .ord-quote { border-left: 6px solid #d97706; }
    .kind-badge {
      display: inline-block;
      color: #fff;
      font-size: 13px;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 6px;
      margin-right: 8px;
      vertical-align: middle;
    }
    .kind-badge.order { background: var(--blue); }
    .kind-badge.quote { background: #d97706; }
    /* 依頼明細：表ではなく1行カード（スマホでも単価欄が切れない） */
    .ans-item {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 16px;
      align-items: center;
      justify-content: space-between;
      padding: 10px 2px;
      border-bottom: 1px solid var(--border);
    }
    .ans-desc { font-size: 15px; font-weight: 600; }
    .ans-price { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 8px; white-space: nowrap; }
    .ans-price input { width: 140px; text-align: right; font-size: 17px; }
    .ans-price-done { font-weight: 700; color: var(--green); }
    @media (max-width: 759px) {
      .ans-item { display: block; }
      .ans-price { display: block; margin-top: 6px; white-space: normal; }
      .ans-price input { width: 100%; margin-top: 4px; }
    }
    /* PC: 1行を横一列に並べてキーボード入力を速く（スマホは縦並びのまま） */
    @media (min-width: 760px) {
      .wrap { max-width: 1080px; }
      .grid { grid-template-columns: 1.7fr 0.8fr 0.9fr 0.7fr 1.1fr; align-items: end; }
      .grid .full { grid-column: auto; }
      input, select { font-size: 15px; padding: 8px 9px; }
      label { font-size: 12px; margin-bottom: 2px; }
      .row-card { padding: 10px 14px; }
      .row-head { margin-bottom: 4px; }
      .kg { margin-top: 4px; }
      .btn-primary { max-width: 320px; margin: 0 auto; display: block; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div id="loading" class="center">確認しています…</div>

    <div id="invalid" class="hidden">
      <div class="card">
        <div class="msg-err" id="invalidMsg">この URL は無効です。お手数ですが発行元にご確認ください。</div>
      </div>
    </div>

    <div id="main" class="hidden">
      <div style="font-size:13px;font-weight:700;color:var(--blue);letter-spacing:.5px;margin-top:4px">有限会社日勝ネジ工業　材料発注・納入ポータル</div>
      <h1 id="supName">—</h1>
      <div class="sub">発注・見積のご依頼への回答と、納入明細のご入力ができるページです。</div>

      <div class="card hidden" id="ordersCard">
        <div style="font-weight:700;margin-bottom:4px">📋 発注・見積のご依頼</div>
        <div class="sub" style="margin-bottom:10px">
          <span class="kind-badge order" style="font-size:11px">発注</span>単価と納入予定日を入れて「入力完了」
          ／ <span class="kind-badge quote" style="font-size:11px">見積依頼</span>単価を入れて「見積を送信」
        </div>
        <div id="ordersList"></div>
      </div>

      <div style="font-weight:700;font-size:17px;margin:26px 0 8px">📦 納入明細の入力
        <span style="font-weight:400;font-size:12px;color:var(--muted)">　納品いただいた内容のご報告です（上のご依頼への回答とは別の機能）</span>
      </div>
      <div class="card">
        <label for="dlvDate">納入日</label>
        <input type="date" id="dlvDate" style="max-width: 220px">
      </div>

      <div class="card">
        <div style="font-weight:700; margin-bottom:10px">明細</div>
        <div class="rows" id="rows"></div>
        <div style="margin-top:12px">
          <button type="button" class="btn btn-sub" id="btnAddRow">＋ 行を追加</button>
        </div>
      </div>

      <div class="card">
        <button type="button" class="btn btn-primary" id="btnSend">納入明細を送信する</button>
        <div id="sendMsg" style="margin-top:10px; min-height:22px"></div>
      </div>

      <div class="card done-card hidden" id="doneCard">
        <div class="done-title">✅ 送信しました。ありがとうございました。</div>
        <div id="doneSummary" style="font-size:14px"></div>
        <div style="margin-top:10px">
          <button type="button" class="btn btn-sub" id="btnAgain">続けて入力する</button>
        </div>
      </div>

      <div class="card">
        <div style="font-weight:700; margin-bottom:8px">最近送信した明細</div>
        <div class="hist-scroll">
          <table>
            <thead>
              <tr><th>納入日</th><th>材質</th><th class="num">径</th><th class="num">長さ</th><th class="num">本数</th><th class="num">金額(円)</th></tr>
            </thead>
            <tbody id="histBody"><tr><td colspan="6" style="color:var(--muted)">—</td></tr></tbody>
          </table>
        </div>
      </div>
      <p style="text-align:center;font-size:12px;color:var(--muted);margin:24px 0 0">
        有限会社日勝ネジ工業　材料発注・納入ポータル<br>ご不明な点は（有）日勝ネジまでご連絡ください。
      </p>
    </div>
  </div>

  <script>
(function () {
  var KEY = new URLSearchParams(location.search).get('k') || '';
  var MATERIALS = [];
  var sending = false;

  function $(id) { return document.getElementById(id); }

  function todayISO() {
    var d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }

  /* 全角数字・記号を半角へ、桁区切りカンマ・空白は除去（「15,000」→15 で登録される事故防止） */
  function toHalf(s) {
    return String(s || '')
      .replace(/[０-９．]/g, function (ch) {
        return ch === '．' ? '.' : String.fromCharCode(ch.charCodeAt(0) - 0xFEE0);
      })
      .replace(/[，、,\s]/g, '');
  }

  function numVal(el) {
    var v = toHalf(el.value).trim();
    if (v !== el.value) el.value = v;
    var n = parseFloat(v);
    return isFinite(n) ? n : NaN;
  }

  function matLabel(key) {
    var m = MATERIALS.find(function (x) { return x.key === key; });
    return m ? m.label : key;
  }

  function matRho(key) {
    var m = MATERIALS.find(function (x) { return x.key === key; });
    return m ? m.rho : 7.85;
  }

  /* d は丸棒＝直径φ／六角＝対辺。六角（キーが_HEX）は対辺²×√3/2 の断面で計算 */
  function kgOneBar(d, l, rho, matKey) {
    var areaMm2 = /_HEX$/.test(String(matKey || ''))
      ? (Math.sqrt(3) / 2) * d * d
      : Math.PI * (d / 2) * (d / 2);
    return (areaMm2 * l / 1000) * rho / 1000;
  }

  function materialOptions() {
    return MATERIALS.map(function (m) {
      return '<option value="' + m.key + '">' + m.label + '</option>';
    }).join('');
  }

  var rowSeq = 0;

  function updateRowKg(card) {
    var d = parseFloat(toHalf(card.querySelector('.f-d').value));
    var l = parseFloat(toHalf(card.querySelector('.f-l').value));
    var q = parseInt(toHalf(card.querySelector('.f-q').value), 10);
    var el = card.querySelector('.kg');
    if (!isFinite(d) || d <= 0 || !isFinite(l) || l <= 0) { el.textContent = ''; return; }
    var mk = card.querySelector('.f-mat').value;
    var kg = kgOneBar(d, l, matRho(mk), mk) * (isFinite(q) && q > 0 ? q : 1);
    el.textContent = '参考重量: 約 ' + (Math.round(kg * 100) / 100) + ' kg';
  }

  function renumber() {
    var cards = document.querySelectorAll('#rows .row-card');
    cards.forEach(function (c, i) {
      c.querySelector('.row-no').textContent = (i + 1) + ' 行目';
      c.querySelector('.btn-del').style.visibility = cards.length > 1 ? 'visible' : 'hidden';
    });
  }

  function lastRowCard() {
    var cards = document.querySelectorAll('#rows .row-card');
    return cards.length ? cards[cards.length - 1] : null;
  }

  function addRow(copyMatKey) {
    rowSeq++;
    var card = document.createElement('div');
    card.className = 'row-card';
    card.innerHTML =
      '<div class="row-head"><span class="row-no"></span>' +
      '<button type="button" class="btn-del">この行を削除</button></div>' +
      '<div class="grid">' +
      '<div class="full"><label>材質</label><select class="f-mat">' + materialOptions() + '</select></div>' +
      '<div><label>径 φ（mm）</label><input class="f-d" type="text" inputmode="decimal" placeholder="例: 25"></div>' +
      '<div><label>長さ（mm）</label><input class="f-l" type="text" inputmode="decimal" placeholder="例: 4000"></div>' +
      '<div><label>本数</label><input class="f-q" type="text" inputmode="numeric" value="1"></div>' +
      '<div><label>金額（円・税別合計）</label><input class="f-t" type="text" inputmode="numeric" placeholder="例: 15000"></div>' +
      '</div><div class="kg"></div>';
    $('rows').appendChild(card);

    card.querySelector('.btn-del').addEventListener('click', function () {
      card.remove();
      renumber();
    });
    ['.f-mat', '.f-d', '.f-l', '.f-q'].forEach(function (sel) {
      card.querySelector(sel).addEventListener('input', function () { updateRowKg(card); });
      card.querySelector(sel).addEventListener('change', function () { updateRowKg(card); });
    });
    /* Enter で次の欄へ。最終行の金額欄では新しい行を自動追加（材質は引き継ぎ）して径欄へ。
       空のままもう一度 Enter すると送信ボタンへ移る */
    card.querySelectorAll('input, select').forEach(function (el) {
      el.addEventListener('keydown', function (e) {
        if (e.key !== 'Enter') return;
        e.preventDefault();
        var isAmount = el.classList.contains('f-t');
        var isLastRow = lastRowCard() === card;
        if (isAmount && isLastRow) {
          if (toHalf(el.value).trim() === '') {
            $('btnSend').focus();
            return;
          }
          var next = addRow(card.querySelector('.f-mat').value);
          next.querySelector('.f-d').focus();
          return;
        }
        var all = Array.prototype.slice.call(document.querySelectorAll('#rows input, #rows select'));
        var i = all.indexOf(el);
        if (i >= 0 && i < all.length - 1) all[i + 1].focus();
        else $('btnSend').focus();
      });
    });
    if (copyMatKey) card.querySelector('.f-mat').value = copyMatKey;
    renumber();
    return card;
  }

  function collectItems() {
    var items = [];
    var errs = [];
    document.querySelectorAll('#rows .row-card').forEach(function (card, i) {
      var mat = card.querySelector('.f-mat').value;
      var d = numVal(card.querySelector('.f-d'));
      var l = numVal(card.querySelector('.f-l'));
      var q = numVal(card.querySelector('.f-q'));
      var t = numVal(card.querySelector('.f-t'));
      var empty = isNaN(d) && isNaN(l) && isNaN(t);
      if (empty) return; /* 未記入の行は無視 */
      var row = i + 1;
      if (isNaN(d) || d <= 0) errs.push(row + '行目: 径を入力してください');
      if (isNaN(l) || l <= 0) errs.push(row + '行目: 長さを入力してください');
      if (isNaN(q) || q <= 0) errs.push(row + '行目: 本数を入力してください');
      if (isNaN(t) || t <= 0) errs.push(row + '行目: 金額を入力してください');
      if (errs.length) return;
      items.push({ materialKey: mat, d: d, l: l, qty: Math.round(q), totalYen: Math.round(t) });
    });
    return { items: items, errs: errs };
  }

  /* 発注・見積依頼への回答 */
  function renderOrder(o) {
    var isOrder = o.kind === 'order';
    var box = document.createElement('div');
    box.className = 'row-card ' + (isOrder ? 'ord-order' : 'ord-quote');
    box.style.marginBottom = '12px';
    var isOpen = o.status === 'sent';
    var head = document.createElement('div');
    head.style.cssText = 'font-weight:700;margin-bottom:8px';
    var badge = document.createElement('span');
    badge.className = 'kind-badge ' + (isOrder ? 'order' : 'quote');
    badge.textContent = o.kindLabel;
    head.appendChild(badge);
    var doneText = isOrder
      ? ' — 手配済み' + (o.deliveryDate ? '・納入予定 ' + o.deliveryDate : '')
      : ' — 見積済み';
    head.appendChild(document.createTextNode('（' + o.created + '）' + (isOpen ? '' : doneText)));
    if (isOpen) {
      var ask = document.createElement('span');
      ask.style.cssText = 'color:var(--red);font-size:12px;margin-left:8px;font-weight:600';
      ask.textContent = isOrder
        ? '単価と納入予定日のご入力をお願いします'
        : '単価のご記入をお願いします';
      head.appendChild(ask);
    }
    box.appendChild(head);
    if (o.note) {
      var noteEl = document.createElement('div');
      noteEl.style.cssText = 'font-size:13px;color:var(--muted);margin-bottom:8px';
      noteEl.textContent = '備考: ' + o.note;
      box.appendChild(noteEl);
    }

    var itemsWrap = document.createElement('div');
    o.items.forEach(function (it) {
      var pref = /_HEX$/.test(String(it.materialKey || '')) ? '対辺' : 'φ';
      var row = document.createElement('div');
      row.className = 'ans-item';
      var desc = document.createElement('div');
      desc.className = 'ans-desc';
      desc.textContent = matLabel(it.materialKey) + '　' + pref + it.d + '×' + it.l + '　' + it.qty + '本';
      row.appendChild(desc);
      if (isOpen) {
        var lbl = document.createElement('label');
        lbl.className = 'ans-price';
        lbl.innerHTML = '単価（円/本・税別）<input type="text" class="a-p" inputmode="numeric" placeholder="例: 1500">';
        row.appendChild(lbl);
      } else {
        var done = document.createElement('div');
        done.className = 'ans-price-done';
        done.textContent = '単価 ' + (it.unitPrice != null ? Number(it.unitPrice).toLocaleString('ja-JP') + ' 円' : '—');
        row.appendChild(done);
      }
      itemsWrap.appendChild(row);
    });
    box.appendChild(itemsWrap);

    if (isOpen) {
      var foot = document.createElement('div');
      foot.style.cssText = 'display:flex;gap:10px;align-items:end;flex-wrap:wrap;margin-top:10px';
      var dateInput = null;
      if (o.kind === 'order') {
        var dwrap = document.createElement('div');
        dwrap.innerHTML = '<label>納入予定日</label>';
        dateInput = document.createElement('input');
        dateInput.type = 'date';
        dwrap.appendChild(dateInput);
        foot.appendChild(dwrap);
      }
      var sendBtn = document.createElement('button');
      sendBtn.type = 'button';
      sendBtn.className = 'btn btn-primary';
      sendBtn.style.cssText = 'width:auto;padding:12px 24px;font-size:16px;margin:0' +
        (isOrder ? '' : ';background:#d97706');
      sendBtn.textContent = isOrder ? '入力完了' : '見積を送信';
      var msg = document.createElement('span');
      msg.className = 'msg-err';
      msg.style.fontSize = '13px';
      foot.appendChild(sendBtn);
      foot.appendChild(msg);
      box.appendChild(foot);

      /* Enter で次の単価欄へ → 納入予定日 → ボタン */
      var priceInputs = box.querySelectorAll('.a-p');
      Array.prototype.forEach.call(priceInputs, function (el, i) {
        el.addEventListener('keydown', function (e) {
          if (e.key !== 'Enter') return;
          e.preventDefault();
          if (i < priceInputs.length - 1) priceInputs[i + 1].focus();
          else if (dateInput) dateInput.focus();
          else sendBtn.focus();
        });
      });

      sendBtn.addEventListener('click', function () {
        var prices = Array.prototype.map.call(box.querySelectorAll('.a-p'), function (el) {
          var v = parseFloat(toHalf(el.value));
          return isFinite(v) && v > 0 ? Math.round(v) : null;
        });
        if (!prices.some(function (p) { return p != null; })) {
          msg.textContent = '単価を1行以上入力してください';
          return;
        }
        if (o.kind === 'order' && dateInput && !dateInput.value) {
          msg.textContent = '納入予定日を選んでください';
          return;
        }
        var missing = [];
        o.items.forEach(function (it, i) {
          if (prices[i] == null) missing.push((i + 1) + '行目（' + matLabel(it.materialKey) + '）');
        });
        var warn = missing.length && missing.length < o.items.length
          ? '\n\n※' + missing.join('・') + ' は単価未入力のまま送信されます。'
          : '';
        if (!confirm((isOrder
          ? 'この内容で入力を完了します。'
          : 'この内容で見積を送信します。') + warn + '\nよろしいですか？')) return;
        sendBtn.disabled = true;
        msg.textContent = '';
        fetch('/api/nonyu/orders/' + encodeURIComponent(o.id) + '/answer', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            k: KEY,
            unitPrices: prices,
            deliveryDate: dateInput ? dateInput.value : '',
          }),
        }).then(function (res) {
          return res.json().then(function (b) {
            if (!res.ok) throw new Error((b && b.error) || res.statusText);
          });
        }).then(function () {
          loadOrders();
          loadRecent();
        }).catch(function (err) {
          msg.textContent = '送信できませんでした: ' + (err && err.message ? err.message : err);
          sendBtn.disabled = false;
        });
      });
    }
    return box;
  }

  function loadOrders() {
    fetch('/api/nonyu/orders?k=' + encodeURIComponent(KEY)).then(function (res) {
      return res.json();
    }).then(function (body) {
      var orders = Array.isArray(body.orders) ? body.orders : [];
      var card = $('ordersCard');
      if (!orders.length) { card.classList.add('hidden'); return; }
      card.classList.remove('hidden');
      var wrap = $('ordersList');
      wrap.innerHTML = '';
      orders.forEach(function (o) { wrap.appendChild(renderOrder(o)); });
    }).catch(function () { /* 回答欄は補助なので黙ってスキップ */ });
  }

  function loadRecent() {
    fetch('/api/nonyu/recent?k=' + encodeURIComponent(KEY)).then(function (res) {
      return res.json();
    }).then(function (body) {
      var recs = Array.isArray(body.records) ? body.records : [];
      var tb = $('histBody');
      if (!recs.length) {
        tb.innerHTML = '<tr><td colspan="6" style="color:var(--muted)">まだ送信履歴はありません</td></tr>';
        return;
      }
      tb.innerHTML = recs.map(function (r) {
        return '<tr><td>' + (r.date || '') + '</td><td>' + matLabel(r.materialKey) +
          '</td><td class="num">' + r.d + '</td><td class="num">' + r.l +
          '</td><td class="num">' + r.qty + '</td><td class="num">' +
          Number(r.totalYen).toLocaleString('ja-JP') + '</td></tr>';
      }).join('');
    }).catch(function () { /* 履歴は補助情報なので黙ってスキップ */ });
  }

  function setSendMsg(text, ok) {
    var el = $('sendMsg');
    el.textContent = text;
    el.className = ok ? 'msg-ok' : 'msg-err';
  }

  function send() {
    if (sending) return;
    var date = $('dlvDate').value;
    if (!date) { setSendMsg('納入日を選んでください', false); return; }
    var c = collectItems();
    if (c.errs.length) { setSendMsg(c.errs.join('\n'), false); return; }
    if (!c.items.length) { setSendMsg('明細を1行以上入力してください', false); return; }

    var lines = c.items.map(function (it, i) {
      var pref = /_HEX$/.test(String(it.materialKey || '')) ? '対辺' : 'φ';
      return (i + 1) + '. ' + matLabel(it.materialKey) + ' ' + pref + it.d + '×' + it.l + ' ' + it.qty + '本 ' +
        it.totalYen.toLocaleString('ja-JP') + '円';
    });
    if (!confirm('この内容で送信します。よろしいですか？\n\n納入日: ' + date + '\n' + lines.join('\n'))) return;

    sending = true;
    $('btnSend').disabled = true;
    setSendMsg('送信しています…', true);
    fetch('/api/nonyu/deliveries', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ k: KEY, date: date, items: c.items }),
    }).then(function (res) {
      return res.json().then(function (b) {
        if (!res.ok) throw new Error((b && b.error) || res.statusText);
        return b;
      });
    }).then(function (body) {
      setSendMsg('', true);
      $('doneSummary').innerHTML = '納入日 ' + date + ' ・ ' + body.count + ' 行を送信しました。<br>' +
        lines.map(function (l) { return l; }).join('<br>');
      $('doneCard').classList.remove('hidden');
      $('doneCard').scrollIntoView({ behavior: 'smooth', block: 'center' });
      $('rows').innerHTML = '';
      addRow();
      loadRecent();
    }).catch(function (err) {
      setSendMsg('送信できませんでした: ' + (err && err.message ? err.message : err), false);
    }).finally(function () {
      sending = false;
      $('btnSend').disabled = false;
    });
  }

  function init() {
    if (!KEY) {
      $('loading').classList.add('hidden');
      $('invalid').classList.remove('hidden');
      return;
    }
    fetch('/api/nonyu/me?k=' + encodeURIComponent(KEY)).then(function (res) {
      return res.json().then(function (b) {
        if (!res.ok) throw new Error((b && b.error) || res.statusText);
        return b;
      });
    }).then(function (body) {
      MATERIALS = body.materials || [];
      $('supName').textContent = body.name + ' 様';
      $('loading').classList.add('hidden');
      $('main').classList.remove('hidden');
      $('dlvDate').value = todayISO();
      addRow();
      loadOrders();
      loadRecent();
    }).catch(function (err) {
      $('loading').classList.add('hidden');
      $('invalidMsg').textContent = (err && err.message) || 'この URL は無効です。';
      $('invalid').classList.remove('hidden');
    });
  }

  $('btnAddRow') && $('btnAddRow').addEventListener('click', function () {
    var prev = lastRowCard();
    var card = addRow(prev ? prev.querySelector('.f-mat').value : null);
    card.querySelector('.f-d').focus();
  });
  $('btnSend').addEventListener('click', send);
  $('btnAgain').addEventListener('click', function () {
    $('doneCard').classList.add('hidden');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  init();
})();
  </script>
</body>
</html>
