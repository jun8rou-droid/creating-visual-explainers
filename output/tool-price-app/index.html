<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>工具費くらべ — 工具価格管理</title>
<!-- Tesseract.js: 端末内/オフラインOCR（品番読み取り）。CDN1本のみ依存 -->
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
  :root{
    --bg:#f4f6f8; --card:#fff; --ink:#1c2530; --sub:#64748b;
    --line:#e2e8f0; --pri:#2563eb; --pri-d:#1d4ed8;
    --up:#dc2626; --down:#16a34a; --warn:#f59e0b;
    --r:14px; --shadow:0 1px 3px rgba(15,23,42,.08),0 1px 2px rgba(15,23,42,.04);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
    background:var(--bg); color:var(--ink); line-height:1.6;
    padding-bottom:78px; -webkit-text-size-adjust:100%;
  }
  header.appbar{
    position:sticky;top:0;z-index:30;background:var(--pri);color:#fff;
    padding:12px 16px;display:flex;align-items:center;gap:10px;
    box-shadow:0 2px 8px rgba(37,99,235,.25);
  }
  header.appbar .logo{font-weight:800;font-size:18px;letter-spacing:.02em}
  header.appbar .spacer{flex:1}
  .wrap{max-width:920px;margin:0 auto;padding:16px}
  h2.section{font-size:15px;color:var(--sub);margin:22px 4px 10px;font-weight:700}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
  .pad{padding:16px}

  /* buttons */
  button{font-family:inherit;cursor:pointer;border:none;border-radius:12px;font-weight:700}
  .btn{padding:13px 18px;font-size:16px;background:var(--pri);color:#fff;transition:.15s}
  .btn:active{transform:scale(.98)}
  .btn.ghost{background:#fff;color:var(--pri);border:1.5px solid var(--pri)}
  .btn.gray{background:#eef2f7;color:var(--ink)}
  .btn.sm{padding:10px 14px;font-size:14px;border-radius:10px;min-width:44px;min-height:44px}
  a.btn{text-decoration:none}
  input.invalid,textarea.invalid{border-color:var(--up)!important;background:#fef2f2}
  .pninfo{font-size:13px;border-radius:10px;padding:9px 12px;margin-top:8px;line-height:1.5}
  .pninfo.ok{background:#f0fdf4;border:1px solid #bbf7d0;color:#166534}
  .pninfo.warn{background:#fffbeb;border:1px solid #fde68a;color:#92400e}
  /* AI読み取りの信頼度: 高=緑 / 中=黄 / 低=赤 */
  .conf-high{border-color:#86efac!important}
  .conf-mid{border-color:#fcd34d!important;background:#fffdf5}
  .conf-low{border-color:#fca5a5!important;background:#fef7f7}
  .confdot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:baseline}
  .confdot.high{background:#22c55e} .confdot.mid{background:#f59e0b} .confdot.low{background:#ef4444}
  .btn.block{width:100%;display:block}
  .btn.hero{
    width:100%;padding:22px;font-size:20px;border-radius:18px;
    background:linear-gradient(135deg,#2563eb,#1d4ed8);
    box-shadow:0 8px 20px rgba(37,99,235,.35);
    display:flex;align-items:center;justify-content:center;gap:10px;
  }
  .btn.hero .ic{font-size:28px}

  /* fields */
  label.f{display:block;font-size:13px;color:var(--sub);font-weight:700;margin:14px 0 6px}
  input,select,textarea{
    width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:12px;
    font-size:16px;font-family:inherit;background:#fff;color:var(--ink)
  }
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--pri)}
  .req::after{content:" 必須";color:var(--up);font-size:11px}

  /* chips */
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
  .chip{padding:9px 14px;border-radius:999px;background:#eef2f7;border:1.5px solid var(--line);font-size:15px;font-weight:700}
  .chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}
  .chip.cand{background:#fff7ed;border-color:#fed7aa;color:#9a3412}
  /* 品番らしい候補=青 / 数字だけの候補=グレー */
  .chip.cand-pn{background:#eff6ff;border-color:#93c5fd;color:#1d4ed8}
  .chip.cand-num{background:#f1f5f9;border-color:#cbd5e1;color:#475569}
  .chip.picked{background:var(--pri);color:#fff;border-color:var(--pri)}
  .cand-legend{display:flex;gap:14px;width:100%;margin:2px 0 2px;font-size:12px;color:var(--sub)}
  .cand-legend span{display:inline-flex;align-items:center;gap:5px}
  .cand-legend .dot{width:11px;height:11px;border-radius:3px;display:inline-block}
  .cand-legend .dot.pn{background:#93c5fd} .cand-legend .dot.num{background:#cbd5e1}

  /* list rows */
  .row{display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid var(--line)}
  .row:last-child{border-bottom:none}
  .row .thumb{width:48px;height:48px;border-radius:10px;object-fit:cover;background:#e2e8f0;flex:none}
  .row .grow{flex:1;min-width:0}
  .row .pn{font-weight:800;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .row .meta{font-size:12px;color:var(--sub)}
  .row .price{font-weight:800;font-size:16px;text-align:right;white-space:nowrap}
  .edit-chip{flex:none;padding:7px 11px;border-radius:10px;border:1.5px solid var(--pri);color:var(--pri);
    font-size:13px;font-weight:800;white-space:nowrap;background:#eff6ff}
  .delta{font-size:12px;font-weight:800}
  .delta.up{color:var(--up)} .delta.down{color:var(--down)} .delta.flat{color:var(--sub)}

  .badge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:800;background:#eef2f7;color:var(--sub)}
  .pill{display:inline-flex;align-items:center;gap:5px;padding:6px 11px;border-radius:999px;background:#eef2f7;font-size:13px;font-weight:700;margin:0 6px 6px 0}

  /* stats grid */
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center}
  .stat .v{font-size:19px;font-weight:800} .stat .k{font-size:11px;color:var(--sub)}
  /* 詳細画面のコンパクトな価格まとめ（1行4項目） */
  .statline{display:flex;text-align:center;border-top:1px solid var(--line);padding-top:10px}
  .statline>div{flex:1;min-width:0}
  .statline>div+div{border-left:1px solid var(--line)}
  .statline .k{font-size:11px;color:var(--sub)}
  .statline .v{font-size:15px;font-weight:800;white-space:nowrap}

  .cat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  .cat-tile{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow)}
  .cat-tile .n{font-weight:800;font-size:16px} .cat-tile .c{font-size:12px;color:var(--sub)}

  details.opt{margin-top:16px;border:1px dashed var(--line);border-radius:12px;padding:4px 14px;background:#fafbfc}
  details.opt summary{padding:11px 0;font-weight:700;color:var(--pri);cursor:pointer;list-style:none}
  details.opt summary::-webkit-details-marker{display:none}
  details.opt summary::before{content:"＋ ";font-weight:800}
  details.opt[open] summary::before{content:"− "}

  .empty{text-align:center;color:var(--sub);padding:40px 20px}
  .empty .em{font-size:42px}

  /* bottom tab */
  nav.tabs{
    position:fixed;left:0;right:0;bottom:0;z-index:40;background:#fff;border-top:1px solid var(--line);
    display:flex;justify-content:space-around;padding:6px 0 max(6px,env(safe-area-inset-bottom))
  }
  nav.tabs a{flex:1;text-align:center;text-decoration:none;color:var(--sub);font-size:11px;font-weight:700;padding:4px}
  nav.tabs a .ic{display:block;font-size:21px;line-height:1.2}
  nav.tabs a.on{color:var(--pri)}

  /* fab */
  .fab{position:fixed;right:18px;bottom:74px;z-index:41;width:62px;height:62px;border-radius:50%;
    background:linear-gradient(135deg,#2563eb,#1d4ed8);color:#fff;font-size:28px;
    box-shadow:0 8px 22px rgba(37,99,235,.45);display:flex;align-items:center;justify-content:center}

  .photo-preview{width:100%;border-radius:14px;border:1px solid var(--line);display:block;margin-top:10px}
  /* 写真上のOCR候補オーバーレイ */
  .photo-wrap{position:relative;display:block;width:100%;margin-top:10px;line-height:0}
  .photo-wrap .photo-preview{margin-top:0}
  .ocr-box{position:absolute;border:2.5px solid;border-radius:5px;cursor:pointer;box-sizing:border-box;line-height:1}
  .ocr-box.pn{border-color:#2563eb;background:rgba(37,99,235,.16)}
  .ocr-box.num{border-color:#64748b;background:rgba(100,116,139,.14)}
  .ocr-box.picked{border-color:#16a34a;background:rgba(22,163,74,.26);border-width:3px;z-index:5}
  .ocr-box .tag{position:absolute;top:-15px;left:-2px;font-size:11px;font-weight:800;
    padding:1px 5px;border-radius:5px;color:#fff;white-space:nowrap}
  .ocr-box.pn .tag{background:#2563eb} .ocr-box.num .tag{background:#64748b} .ocr-box.picked .tag{background:#16a34a}
  .thumbs{display:flex;gap:8px;flex-wrap:wrap}
  .thumbs img{width:88px;height:88px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}

  .bars .bar-row{display:flex;align-items:center;gap:10px;margin:8px 0}
  .bars .bar-name{width:96px;font-size:13px;font-weight:700;flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bars .bar-track{flex:1;background:#eef2f7;border-radius:8px;height:22px;overflow:hidden}
  .bars .bar-fill{height:100%;background:linear-gradient(90deg,#60a5fa,#2563eb);border-radius:8px}
  .bars .bar-fill.best{background:linear-gradient(90deg,#4ade80,#16a34a)}
  .bars .bar-val{width:78px;text-align:right;font-size:13px;font-weight:800;flex:none}

  .toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#1c2530;color:#fff;
    padding:11px 18px;border-radius:999px;font-weight:700;z-index:60;opacity:0;transition:.25s;pointer-events:none}
  .toast.show{opacity:1}

  .ocr-status{font-size:13px;color:var(--sub);margin-top:8px;display:flex;align-items:center;gap:8px}
  .spin{width:15px;height:15px;border:2px solid var(--line);border-top-color:var(--pri);border-radius:50%;animation:sp 1s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}

  .link{color:var(--pri);font-weight:700;text-decoration:none}
  .topnote{font-size:12px;color:var(--sub);background:#eef6ff;border:1px solid #cfe2ff;border-radius:10px;padding:8px 12px;margin-bottom:8px}

  @media(min-width:760px){
    .two-col{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
    .cat-grid{grid-template-columns:repeat(3,1fr)}
  }
  /* PC: 下部タブを左サイドメニューに切替 */
  @media(min-width:900px){
    body{padding-left:200px;padding-bottom:24px}
    nav.tabs{top:0;bottom:0;left:0;right:auto;width:200px;z-index:20;
      flex-direction:column;justify-content:flex-start;gap:4px;
      border-top:none;border-right:1px solid var(--line);padding:76px 10px 10px}
    nav.tabs a{flex:none;display:flex;align-items:center;gap:12px;text-align:left;
      font-size:15px;padding:13px 14px;border-radius:10px}
    nav.tabs a .ic{display:inline;font-size:20px;line-height:1}
    nav.tabs a.on{background:#eef2ff}
    .fab{bottom:24px}
    .toast{bottom:40px}
  }
</style>
</head>
<body>

<header class="appbar">
  <span class="logo">🔧 工具費くらべ</span>
  <span class="spacer"></span>
  <button class="btn sm gray" aria-label="検索" onclick="location.hash='#/search'">🔍</button>
  <button class="btn sm gray" aria-label="設定・バックアップ" onclick="location.hash='#/settings'" title="設定・バックアップ">⚙️</button>
</header>

<main id="view" class="wrap"><!-- 画面はJSで描画 --></main>

<a class="fab" href="#/register" title="写真で登録" aria-label="写真で登録">📷</a>

<nav class="tabs">
  <a data-tab="home" href="#/home"><span class="ic">🏠</span>ホーム</a>
  <a data-tab="tools" href="#/tools"><span class="ic">🔧</span>工具</a>
  <a data-tab="suppliers" href="#/suppliers"><span class="ic">🏪</span>工具屋</a>
  <a data-tab="history" href="#/history"><span class="ic">📅</span>履歴</a>
  <a data-tab="settings" href="#/settings"><span class="ic">⚙️</span>設定</a>
</nav>

<div class="toast" id="toast"></div>

<script>
/* =========================================================================
 * 工具費くらべ — 単一HTML / IndexedDB / Tesseract.js
 * すべて端末内（オフライン動作）。サーバー不要。
 * ========================================================================= */

const DEFAULT_CATEGORIES = ['ドリル','チップ','タップ','エンドミル','ホルダー','測定具','その他'];
/* 工具屋は選択制（固定リスト） */
const SHOPS = ['武岡','フジタ','センナン','旭','その他'];

/* ---------- IndexedDB 薄ラッパ ---------- */
const DB = (() => {
  let db;
  function open(){
    return new Promise((res,rej)=>{
      const r = indexedDB.open('toolPriceDB', 2);
      r.onupgradeneeded = e => {
        const d = e.target.result;
        if(!d.objectStoreNames.contains('tools'))
          d.createObjectStore('tools',{keyPath:'partNumber'});
        if(!d.objectStoreNames.contains('prices')){
          const s = d.createObjectStore('prices',{keyPath:'id',autoIncrement:true});
          s.createIndex('by_partNumber','partNumber',{unique:false});
          s.createIndex('by_category','category',{unique:false});
          s.createIndex('by_shop','shop',{unique:false});
        }
        if(!d.objectStoreNames.contains('images'))
          d.createObjectStore('images',{keyPath:'id',autoIncrement:true});
        if(!d.objectStoreNames.contains('meta'))
          d.createObjectStore('meta',{keyPath:'name'});
        // v2: 工具屋マスター / OCR下書き
        if(!d.objectStoreNames.contains('suppliers'))
          d.createObjectStore('suppliers',{keyPath:'id',autoIncrement:true});
        if(!d.objectStoreNames.contains('ocrDrafts'))
          d.createObjectStore('ocrDrafts',{keyPath:'id',autoIncrement:true});
      };
      r.onsuccess = e => { db = e.target.result; res(db); };
      r.onerror = e => rej(e.target.error);
    });
  }
  function tx(store,mode='readonly'){ return db.transaction(store,mode).objectStore(store); }
  function reqP(req){ return new Promise((res,rej)=>{ req.onsuccess=()=>res(req.result); req.onerror=()=>rej(req.error); }); }
  function getAll(store){ return reqP(tx(store).getAll()); }
  function get(store,key){ return reqP(tx(store).get(key)); }
  function put(store,val){ return reqP(tx(store,'readwrite').put(val)); }
  function del(store,key){ return reqP(tx(store,'readwrite').delete(key)); }
  function clear(store){ return reqP(tx(store,'readwrite').clear()); }
  return {open,getAll,get,put,del,clear};
})();

/* ---------- メタ（カテゴリ・候補値） ---------- */
async function getMeta(name, fallback){
  const m = await DB.get('meta', name);
  return m ? m.value : fallback;
}
async function setMeta(name, value){ await DB.put('meta', {name, value}); }
async function getCategories(){ return await getMeta('categories', DEFAULT_CATEGORIES.slice()); }

/* ---------- v1→v2 データ移行（既存データ完全保持・一度だけ実行） ---------- */
async function migrateV2(){
  if(await getMeta('dbVersion2', false)) return;
  const now = new Date().toISOString();
  // 1) 工具屋マスター初期投入: 固定5店 + 既存履歴に出てくる店名
  const existing = await DB.getAll('suppliers');
  const byName = {}; existing.forEach(s=>byName[s.name]=s);
  const names = new Set(SHOPS);
  (await DB.getAll('prices')).forEach(p=>{ if(p.shop) names.add(p.shop); });
  for(const name of names){
    if(!byName[name]){
      const id = await DB.put('suppliers', {name, contactPerson:'', phone:'', email:'', address:'',
        paymentTerms:'', closingDay:'', paymentDay:'', website:'', notes:'', createdAt:now, updatedAt:now});
      byName[name] = {id, name};
    }
  }
  // 2) 購入履歴に新項目の既定値と supplierId を付与
  for(const p of await DB.getAll('prices')){
    const q = {...p};
    if(q.taxType==null) q.taxType = '税別';       // 既存データはB2B前提で税別扱い（編集で変更可）
    if(q.taxRate==null) q.taxRate = 10;
    if(q.sourceType==null) q.sourceType = 'manual';
    if(q.documentNumber==null) q.documentNumber = '';
    if(q.qty==null) q.qty = 1;
    q.supplierId = (q.shop && byName[q.shop]) ? byName[q.shop].id : null;
    await DB.put('prices', q);
  }
  // 3) 工具マスターに新項目の既定値
  for(const t of await DB.getAll('tools')){
    const q = {...t};
    for(const k of ['name','size','material','coating']) if(q[k]==null) q[k]='';
    if(q.updatedAt==null) q.updatedAt = q.createdAt || now;
    await DB.put('tools', q);
  }
  await setMeta('dbVersion2', true);
}

/* ---------- 工具屋マスター ---------- */
async function getSuppliers(){ return (await DB.getAll('suppliers')).sort((a,b)=>a.id-b.id); }
async function supplierByName(name){ return (await DB.getAll('suppliers')).find(s=>s.name===name)||null; }
async function supplierIdFor(name){ const s = await supplierByName(name); return s? s.id : null; }
/* ---------- 表記揺れ正規化（照合候補の提示用。自動統合はしない） ---------- */
const MAKER_ALIASES = {
  'KYOCERA':'京セラ','MITSUBISHI':'三菱マテリアル','三菱':'三菱マテリアル','MITSUBISHI MATERIALS':'三菱マテリアル',
  'SUMITOMO':'住友電工','住友':'住友電工','オーエスジー':'OSG','TUNGALOY':'タンガロイ','SANDVIK':'サンドビック',
  'NACHI':'不二越','ナチ':'不二越','MITUTOYO':'ミツトヨ','KORLOY':'コロイ','ISCAR':'イスカル'
};
function zenToHan(str){
  return String(str||'').replace(/[Ａ-Ｚａ-ｚ０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0)).replace(/[－ー―]/g,'-').replace(/　/g,' ');
}
function normalizePn(str){ return zenToHan(str).toUpperCase().replace(/[\s\-\/\.]/g,''); }
function normalizeMaker(str){
  const t = zenToHan(str).trim().toUpperCase();
  return MAKER_ALIASES[t] || str;
}

/* ---------- 小計・合計の自動計算表示（prefix: ''=登録 / 'a_'=追加 / 'e_'=編集） ---------- */
function updateCalc(prefix){
  const el = document.getElementById(prefix+'calcLine'); if(!el) return;
  const price = parseFloat(val(prefix+'price'))||0;
  const qty = Math.max(1, parseInt(val(prefix+'qty'),10)||1);
  const tax = val(prefix+'taxType')||'税別';
  if(!price){ el.textContent=''; return; }
  const sub = Math.round(price*qty);
  if(tax==='税込') el.innerHTML = `税込合計 <b>${yen(sub)}</b>（税別換算 ${yen(Math.round(sub/1.1))}）`;
  else el.innerHTML = `小計 <b>${yen(sub)}</b> ／ 税込 ${yen(Math.round(sub*1.1))}`;
}

/* 税別換算単価（比較・集計はこれで統一。税込は割り戻す） */
function unitPriceExcl(p){
  const rate = (p.taxRate==null?10:p.taxRate)/100;
  return p.taxType==='税込' ? Math.round(p.price/(1+rate)) : p.price;
}
function taxBadge(p){
  if(p.taxType==='税込') return '<span class="badge" style="background:#fef3c7;color:#92400e">税込→換算</span>';
  if(p.taxType==='不明') return '<span class="badge">税区分不明</span>';
  return '';
}

/* 工具屋の選択チップ（選択制）。工具屋マスターの登録店から生成 */
function shopChipsHtml(inputId, selected, names){
  const list = (names && names.length ? names : SHOPS).slice();
  if(selected && !list.includes(selected)) list.push(selected);
  return `<div class="chips" id="${inputId}Chips">` +
    list.map(s=>`<span class="chip ${s===selected?'on':''}" onclick="pickShop('${inputId}','${esc(s).replace(/'/g,'')}',this)">${esc(s)}</span>`).join('') +
    `</div><input type="hidden" id="${inputId}" value="${esc(selected||'')}">`;
}
function pickShop(inputId, name, el){
  formDirty = true;
  const input = document.getElementById(inputId);
  const already = input.value===name;
  input.value = already ? '' : name;   // もう一度タップで選択解除
  document.querySelectorAll('#'+inputId+'Chips .chip').forEach(c=>
    c.classList.toggle('on', !already && c.textContent===name));
}
async function rememberSuggestion(name, val){
  if(!val) return;
  const list = await getMeta('sug_'+name, []);
  if(!list.includes(val)){ list.unshift(val); await setMeta('sug_'+name, list.slice(0,30)); }
}
async function getSuggestions(name){ return await getMeta('sug_'+name, []); }

/* ---------- 画像: リサイズして保存 ---------- */
function resizeImage(file, max=1280){
  return new Promise((res)=>{
    const img = new Image();
    img.onload = ()=>{
      let {width:w, height:h} = img;
      if(Math.max(w,h) > max){ const s = max/Math.max(w,h); w=Math.round(w*s); h=Math.round(h*s); }
      const c = document.createElement('canvas'); c.width=w; c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      c.toBlob(b=>res(b), 'image/jpeg', 0.82);
    };
    img.src = URL.createObjectURL(file);
  });
}
const _urlCache = new Map();
async function imageUrl(imageId){
  if(imageId==null) return null;
  if(_urlCache.has(imageId)) return _urlCache.get(imageId);
  const rec = await DB.get('images', imageId);
  if(!rec) return null;
  const url = URL.createObjectURL(rec.blob);
  _urlCache.set(imageId, url);
  return url;
}

/* ---------- 集計（純粋関数） ---------- */
const yen = n => '¥' + Math.round(n).toLocaleString('ja-JP');
function sortByDate(arr){ return arr.slice().sort((a,b)=>{
  const k = (a.purchaseDate||a.createdAt||'').localeCompare(b.purchaseDate||b.createdAt||'');
  if(k!==0) return k;
  const c = (a.createdAt||'').localeCompare(b.createdAt||'');   // 同日は登録時刻で並べる
  if(c!==0) return c;
  return (a.id||0)-(b.id||0);
}); }
function stats(prices){ // ある品番の価格配列
  const s = sortByDate(prices);
  const vals = s.map(p=>p.price);
  const latest = s[s.length-1];
  const prev = s[s.length-2];
  return {
    count: s.length,
    latest: latest ? latest.price : null,
    min: vals.length ? Math.min(...vals) : null,
    max: vals.length ? Math.max(...vals) : null,
    prevDelta: (latest && prev) ? latest.price - prev.price : null,
    sorted: s
  };
}
function deltaHtml(d){
  if(d==null) return '<span class="delta flat">—</span>';
  if(d>0) return `<span class="delta up">▲ +${yen(d).slice(1)}</span>`;
  if(d<0) return `<span class="delta down">▼ -${yen(-d).slice(1)}</span>`;
  return '<span class="delta flat">±0</span>';
}

}

/* OCRワーカーは1度だけ作って使い回す（2枚目以降は辞書ダウンロード不要で速い）。
   品番は英数字中心なので 'eng' のみ＝軽量・確実。日本語辞書(数MB)は読み込まない。 */
let _ocrWorker = null;
async function getOcrWorker(onProgress){
  if(_ocrWorker) return _ocrWorker;
  _ocrWorker = await Tesseract.createWorker('eng', 1, { logger: onProgress });
  // 品番向けチューニング: 文字種を英数字・ハイフン等に限定（O↔0 等の誤読を抑制）＋
  // ラベル上に散在する文字を拾う SPARSE_TEXT モード
  await _ocrWorker.setParameters({
    tessedit_char_whitelist: 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-/.',
    tessedit_pageseg_mode: '11'
  });
  return _ocrWorker;
}

/* OCR前の画像前処理: 拡大→グレースケール→Otsu法で白黒2値化。
   ラベル・納品書の印字は高コントラスト化するとTesseractの精度が上がる。 */
function blobToImage(blob){ return new Promise((res,rej)=>{ const im=new Image(); im.onload=()=>res(im); im.onerror=rej; im.src=URL.createObjectURL(blob); }); }
async function preprocessForOcr(blob){
  const img = await blobToImage(blob);
  let w = img.naturalWidth, h = img.naturalHeight;
  const scale = w < 1000 ? Math.min(2, 1500/Math.max(1,w)) : 1;   // 小さい写真は拡大して字を大きく
  w = Math.round(w*scale); h = Math.round(h*scale);
  const c = document.createElement('canvas'); c.width=w; c.height=h;
  const ctx = c.getContext('2d'); ctx.drawImage(img,0,0,w,h);
  const id = ctx.getImageData(0,0,w,h), d = id.data, total = w*h;
  const hist = new Array(256).fill(0), gray = new Uint8Array(total);
  for(let i=0,p=0;i<d.length;i+=4,p++){ const g=(d[i]*0.299+d[i+1]*0.587+d[i+2]*0.114)|0; gray[p]=g; hist[g]++; }
  // Otsu法でしきい値を自動決定
  let sum=0; for(let t=0;t<256;t++) sum+=t*hist[t];
  let sumB=0, wB=0, maxVar=-1, thr=127;
  for(let t=0;t<256;t++){
    wB+=hist[t]; if(!wB) continue; const wF=total-wB; if(!wF) break;
    sumB+=t*hist[t]; const mB=sumB/wB, mF=(sum-sumB)/wF, v=wB*wF*(mB-mF)*(mB-mF);
    if(v>maxVar){ maxVar=v; thr=t; }
  }
  for(let i=0,p=0;i<d.length;i+=4,p++){ const v=gray[p]>thr?255:0; d[i]=d[i+1]=d[i+2]=v; }
  ctx.putImageData(id,0,0);
  return c;   // 座標系は canvas(w×h)。枠表示もこの比率で行う
}
async function runOcr(){
  const ocr = document.getElementById('ocrArea');
  if(!regState.imageBlob){ return; }
  if(typeof Tesseract === 'undefined'){
    ocr.innerHTML = `<div class="ocr-status">⚠️ 通信できないため自動読み取りは使えません。品番を手入力してください。</div>`;
    return;
  }
  const setStatus = (txt, spin=true)=>{ ocr.innerHTML = `<div class="ocr-status">${spin?'<span class="spin"></span>':''}${txt}</div>`; };
  setStatus('読み取りの準備中…（初回のみ辞書を取得します）');
  try{
    const worker = await getOcrWorker(m=>{
      if(m.status==='recognizing text') setStatus(`品番を読み取り中… ${Math.round(m.progress*100)}%`);
      else if(m.status && m.progress!=null) setStatus(`準備中… ${Math.round(m.progress*100)}%（${m.status}）`);
    });
    setStatus('画像を調整中…');
    let src = regState.imageBlob;
    try{ const canvas = await preprocessForOcr(regState.imageBlob); regState.ocrW = canvas.width; regState.ocrH = canvas.height; src = canvas; }
    catch(e){ console.warn('preprocess skipped', e); regState.ocrW = regState.imgW; regState.ocrH = regState.imgH; }
    setStatus('品番を読み取り中…');
    const {data} = await worker.recognize(src, {}, { blocks: true });
    regState.lastOcrText = data.text || '';
    const cands = extractCandidates(data);
    regState.candidates = cands;
    if(cands.length){
      setStatus('✅ 候補が見つかりました。写真の枠かチップをタップ →', false);
      renderCandidates(cands);
      renderBoxes(cands);
    }else{
      document.querySelectorAll('.ocr-box').forEach(b=>b.remove());
      ocr.innerHTML = `<div class="ocr-status">品番候補は見つかりませんでした。手入力してください。 <button class="btn sm gray" onclick="runOcr()">🔄 もう一度読み取る</button></div>`;
    }
  }catch(e){
    console.error(e);
    ocr.innerHTML = `<div class="ocr-status">⚠️ 読み取りに失敗しました。手入力するか、もう一度お試しください。 <button class="btn sm gray" onclick="_ocrWorker=null;runOcr()">🔄 再試行</button></div>`;
  }
}
function renderCandidates(cands){
  // 種類で色分け: 品番らしい=青(cand-pn) / 数字だけ=グレー(cand-num)
  const sorted = cands.slice().sort((a,b)=> (a.type==='pn'?0:1) - (b.type==='pn'?0:1));
  document.getElementById('cands').innerHTML =
    `<div class="cand-legend">
       <span><span class="dot pn"></span>品番らしい → 品番欄へ</span>
       <span><span class="dot num"></span>数字 → 価格欄へ</span>
     </div>` +
    sorted.map(c=>{
      const cls = c.type==='pn' ? 'cand-pn' : 'cand-num';
      const v = esc(c.text).replace(/'/g,'');
      return `<span class="chip ${cls}" data-cand="${v}" data-type="${c.type}" onclick="pickCandidate('${v}','${c.type}')">${esc(c.text)}</span>`;
    }).join('');
}
/* 写真の上に、読み取った位置へ色付き枠を重ねる（枠タップで確定） */
function renderBoxes(cands){
  const wrap = document.getElementById('photoWrap');
  if(!wrap) return;
  wrap.querySelectorAll('.ocr-box').forEach(b=>b.remove());
  // 枠位置はOCRにかけた画像(前処理後canvas)の座標系で％化。表示画像と縦横比は同じなので合う
  const W = regState.ocrW || regState.imgW, H = regState.ocrH || regState.imgH;
  if(!W || !H) return;
  cands.filter(c=>c.bbox).forEach(c=>{
    const {x0,y0,x1,y1} = c.bbox;
    const v = esc(c.text).replace(/'/g,'');
    const box = document.createElement('div');
    box.className = 'ocr-box ' + (c.type==='pn'?'pn':'num');
    box.setAttribute('data-cand', v);
    box.setAttribute('data-type', c.type);
    box.style.left   = (x0/W*100)+'%';
    box.style.top    = (y0/H*100)+'%';
    box.style.width  = ((x1-x0)/W*100)+'%';
    box.style.height = ((y1-y0)/H*100)+'%';
    box.onclick = ()=>pickCandidate(c.text, c.type);
    box.innerHTML = `<span class="tag">${esc(c.text)}</span>`;
    wrap.appendChild(box);
  });
}
function pickCandidate(v, type){
  formDirty = true;
  // 数字だけの候補は価格欄へ、品番らしい候補は品番欄へ振り分け
  if(type==='num'){
    const el = document.getElementById('price');
    if(el){ el.value = v.replace(/[^0-9.]/g,''); toast('価格に入れました: '+v); }
  }else{
    document.getElementById('pn').value = v; regState.partNumber = v;
  }
  // チップ・写真の枠の両方で、選んだものをハイライト（品番と価格は別グループ）
  document.querySelectorAll(`[data-cand][data-type="${type}"]`).forEach(e=>
    e.classList.toggle('picked', e.getAttribute('data-cand')===v));
  if(type!=='num') checkPnInfoDebounced();
}
/* OCR結果(blocks)から単語＋座標を集めて候補化。種類を判定。
   type: 'pn'=品番らしい（英字+数字 or ハイフン/スラッシュ入り） / 'num'=数字だけ */
function collectWords(data){
  const words = [];
  (data.blocks||[]).forEach(b=>(b.paragraphs||[]).forEach(p=>(p.lines||[]).forEach(l=>
    (l.words||[]).forEach(w=>words.push(w)))));
  if(!words.length && Array.isArray(data.words)) data.words.forEach(w=>words.push(w));
  return words;
}
function extractCandidates(data){
  const words = collectWords(data);
  const seen = new Set(); const out = [];
  // 単語が取れない場合はテキスト分割にフォールバック（座標なし）
  const items = words.length
    ? words.map(w=>({text:w.text||'', bbox:w.bbox}))
    : String(data.text||'').split(/[\s\n\r、，,]+/).map(t=>({text:t, bbox:null}));
  for(const it of items){
    const cleaned = (it.text||'').trim().replace(/[^0-9A-Za-z\-\/.]/g,'');
    if(cleaned.length<3 || cleaned.length>24) continue;
    if(!/[0-9]/.test(cleaned)) continue;          // 数字を含む
    if(!/[0-9A-Za-z]/.test(cleaned)) continue;
    if(/^\d{1,3}$/.test(cleaned)) continue;        // 短い純数字（価格・個数）は除外
    if(seen.has(cleaned)) continue; seen.add(cleaned);
    const type = (/[A-Za-z]/.test(cleaned) || /[\-\/]/.test(cleaned)) ? 'pn' : 'num';
    out.push({text: cleaned, type, bbox: it.bbox || null});
    if(out.length>=10) break;
  }
  return out;
}

/* 品番入力時: 登録済みなら前回情報、似た品番なら候補を提示（自動統合はしない） */
let _pnInfoT=null;
function checkPnInfoDebounced(){ clearTimeout(_pnInfoT); _pnInfoT=setTimeout(checkPnInfo, 350); }
async function checkPnInfo(){
  const box = document.getElementById('pnInfo'); if(!box) return;
  const raw = val('pn');
  if(!raw){ box.innerHTML=''; return; }
  const [tools, prices] = await Promise.all([DB.getAll('tools'), DB.getAll('prices')]);
  const exact = tools.find(t=>t.partNumber===raw);
  if(exact){
    const ps = sortByDate(prices.filter(p=>p.partNumber===raw));
    const last = ps[ps.length-1];
    box.innerHTML = `<div class="pninfo ok">📌 登録済みの工具です${last?`。前回: ${esc(last.purchaseDate)} ${yen(last.price)} ×${last.qty||1}個${last.shop?`（${esc(last.shop)}）`:''}`:''}。保存すると購入履歴に追加されます</div>`;
    return;
  }
  const norm = normalizePn(raw);
  const similar = tools.filter(t=> normalizePn(t.partNumber)===norm || (t.name && normalizePn(t.name)===norm));
  if(similar.length){
    box.innerHTML = `<div class="pninfo warn">⚠ 似た品番が登録済みです。同じ工具ですか？<div style="margin-top:6px">
      ${similar.slice(0,3).map(t=>`<button class="btn sm gray" onclick="useExistingPn('${esc(t.partNumber).replace(/'/g,'')}')">「${esc(t.partNumber)}」の履歴に追加</button>`).join(' ')}
      <button class="btn sm gray" onclick="dismissPnInfo()">別の工具として登録</button></div></div>`;
  } else box.innerHTML='';
}
function useExistingPn(pn){
  document.getElementById('pn').value = pn; regState.partNumber = pn;

}

/* 画像を安全に削除（他の履歴が同じ画像を使っていれば残す） */
async function safeDeleteImage(imageId, exceptPriceId){
  if(imageId==null) return;
  const stillUsed = (await DB.getAll('prices')).some(p=>p.imageId===imageId && p.id!==exceptPriceId);
  if(stillUsed) return;
  await DB.del('images', imageId).catch(()=>{});
  if(_urlCache.has(imageId)){ URL.revokeObjectURL(_urlCache.get(imageId)); _urlCache.delete(imageId); }
}

  const remain = (await DB.getAll('prices')).filter(p=>p.partNumber===pn);
  if(remain.length===0) await DB.del('tools', pn).catch(()=>{});
}

async function doSearch(){
  const kw = (document.getElementById('kw').value||'').trim().toLowerCase();
  const cat = document.getElementById('fcat').value;
  const {prices:all, toolMap} = await loadAll();
  let res = all.filter(p=>{
    if(cat && catOf(p.partNumber,toolMap)!==cat) return false;
    if(!kw) return true;
    const t_ = toolMap[p.partNumber]||{};
    const usage = t_.memo||t_.usage||'';
    return [p.partNumber, t_.name, makerOf(p.partNumber,toolMap), p.shop, usage].some(f=>(f||'').toLowerCase().includes(kw));
  });
  // 品番ごとに集約して1件に
  const byPn={}; res.forEach(p=>{(byPn[p.partNumber]=byPn[p.partNumber]||[]).push(p);});
  const items = Object.entries(byPn).map(([pn,arr])=>{ const st=stats(arr); return {p:st.sorted[st.sorted.length-1], st}; });
  const el = document.getElementById('results');
  if(items.length===0){ el.innerHTML='<div class="empty"><div class="em">🔍</div>該当なし</div>'; return; }
  el.innerHTML = `<h2 class="section">${items.length}件</h2><div class="card" id="srows"></div>`;
  await fillRows('srows', items);
}

/* ---------- util ---------- */
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* ---------- 価格推移グラフ（SVG折れ線・工具屋別色分け・期間絞り込み） ---------- */
function drawPriceChart(){
  const el = document.getElementById('chartArea'); if(!el) return;
  const recs = window._chartRecs||[];
  const shop = val('ch_shop'), period = val('ch_period')||'all';
  const days = {y1:365, m6:183, m3:92}[period];
  const since = days ? new Date(Date.now()-days*86400000).toISOString().slice(0,10) : null;
  let list = sortByDate(recs.filter(p=>(!shop || (p.shop||'(未選択)')===shop) && (!since || (p.purchaseDate||'')>=since)));
  if(list.length<2){ el.innerHTML='<div style="text-align:center;color:var(--sub);padding:24px;font-size:13px">この条件では履歴が2件未満のため、グラフを表示できません</div>'; return; }
  const W=640,H=250,PL=58,PR=14,PT=12,PB=30;
  const ts = p=>new Date(p.purchaseDate||'2000-01-01').getTime();
  const minX=ts(list[0]), maxX=ts(list[list.length-1]);
  const vals=list.map(unitPriceExcl);
  const minY=Math.min(...vals), maxY=Math.max(...vals);
  const spanX=(maxX-minX)||1, pad=(maxY-minY)||Math.max(maxY*0.1,1);
  const y0=minY-pad*0.15, y1v=maxY+pad*0.15;
  const X=t=>PL+(t-minX)/spanX*(W-PL-PR);
  const Y=v=>PT+(1-(v-y0)/(y1v-y0))*(H-PT-PB);
  const shops=[...new Set(list.map(p=>p.shop||'(未選択)'))];
  const colors=['#2563eb','#16a34a','#f59e0b','#dc2626','#7c3aed','#0891b2'];
  let svg=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" role="img" aria-label="価格推移グラフ">`;
  for(let i=0;i<=3;i++){
    const v=y0+(y1v-y0)*i/3, y=Y(v);
    svg+=`<line x1="${PL}" y1="${y}" x2="${W-PR}" y2="${y}" stroke="#e2e8f0"/>`+
         `<text x="${PL-6}" y="${y+4}" text-anchor="end" font-size="11" fill="#64748b">¥${Math.round(v).toLocaleString()}</text>`;
  }
  svg+=`<text x="${PL}" y="${H-6}" font-size="11" fill="#64748b">${esc(list[0].purchaseDate)}</text>`+
       `<text x="${W-PR}" y="${H-6}" text-anchor="end" font-size="11" fill="#64748b">${esc(list[list.length-1].purchaseDate)}</text>`;
  shops.forEach((sn,si)=>{
    const pts=list.filter(p=>(p.shop||'(未選択)')===sn);
    const col=colors[si%colors.length];
    if(pts.length>1) svg+=`<polyline fill="none" stroke="${col}" stroke-width="2.5" points="${pts.map(p=>X(ts(p))+','+Y(unitPriceExcl(p))).join(' ')}"/>`;
    pts.forEach(p=>{ svg+=`<circle cx="${X(ts(p))}" cy="${Y(unitPriceExcl(p))}" r="4" fill="${col}"><title>${esc(p.purchaseDate)} ${esc(sn)} ¥${unitPriceExcl(p).toLocaleString()}</title></circle>`; });
  });
  svg+='</svg>';
  el.innerHTML = svg + `<div style="display:flex;gap:12px;flex-wrap:wrap;font-size:12px;margin-top:6px">${shops.map((sn,si)=>`<span style="display:inline-flex;align-items:center;gap:5px"><span style="width:10px;height:10px;border-radius:3px;background:${colors[si%colors.length]}"></span>${esc(sn)}</span>`).join('')}</div>`;
}

/* ---------- 工具ごとの集計（税別換算で統一） ---------- */
function aggregateTool(pn, ps, toolMap){
  const st = stats(ps);
  const last = st.sorted[st.sorted.length-1];
  const byShop = {};
  sortByDate(ps).forEach(p=>{ const k=p.shop||'(未選択)'; byShop[k]={price:unitPriceExcl(p), date:p.purchaseDate}; });
  const shopEntries = Object.entries(byShop).sort((a,b)=>a[1].price-b[1].price);
  return {
    pn, tool: toolMap[pn]||{}, st, last,
    latestExcl: last ? unitPriceExcl(last) : null,
    lastDate: last ? last.purchaseDate : '',
    cheapest: shopEntries[0]||null,
    supplierCount: shopEntries.length,
    totalQty: ps.reduce((a,p)=>a+(p.qty||1),0),
    totalAmount: ps.reduce((a,p)=>a+unitPriceExcl(p)*(p.qty||1),0)
  };
}

let _clsBusy=false;
async function aiClassify(){
  if(_clsBusy) return; _clsBusy=true;
  const el = document.getElementById('aiSortArea');
  el.innerHTML = '<div class="pninfo warn"><span class="spin" style="display:inline-block;vertical-align:middle"></span> AIが仕分け中…（数秒）</div>';
  try{
    const tools = (await DB.getAll('tools')).filter(t=>!t.category).slice(0,100);
    const cats = await getCategories();
    const resp = await fetch(AI_ENDPOINT.replace('tool-ocr','tool-classify'), {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({tools: tools.map(t=>({partNumber:t.partNumber, maker:t.maker, name:t.name, usage:t.memo||t.usage, size:t.size})), categories:cats})});
    const data = await resp.json().catch(()=>({}));
    if(!resp.ok) throw new Error(data.error||'AI仕分けに失敗しました');
    await recordAiCost(data.meta);
    const results = (data.results||[]).filter(r=>r.category);
    if(!results.length){ el.innerHTML='<div class="pninfo warn">仕分けできる工具がありませんでした（手動でカテゴリを設定してください）</div>'; return; }
    el.innerHTML = `<div class="card pad" style="margin-top:10px">
      <h3 style="margin:0 0 8px;font-size:15px">🤖 AIの仕分け提案（確認して適用）</h3>
      ${results.map((r,i)=>`
        <div style="display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line)">
          <input type="checkbox" id="cls_${i}" ${r.confidence!=='low'?'checked':''} style="width:22px;height:22px;flex:none">
          <div style="flex:1;min-width:0">
            <div style="font-weight:700;font-size:14px">${esc(r.partNumber)}</div>
          </div>
          <span class="confdot ${r.confidence}"></span>
          <select id="clsCat_${i}" style="width:130px;padding:8px">${(cats).map(c=>`<option ${c===r.category?'selected':''}>${esc(c)}</option>`).join('')}</select>
        </div>`).join('')}
      <button class="btn block" style="margin-top:12px" onclick='applyClassify(${JSON.stringify(results.map(r=>r.partNumber))})'>✅ チェックした工具に適用</button>
      <button class="btn gray block" style="margin-top:8px" onclick="showAiSortBanner()">キャンセル</button>
      <p style="font-size:11px;color:var(--sub);margin:8px 0 0">🟢=確実 🟡=たぶん 🔴=自信なし（🔴は初めからチェックを外しています）${data.meta&&data.meta.costYen!=null?'　'+costLabel(data.meta):''}</p>
    </div>`;
  }catch(e){ console.error(e); el.innerHTML=`<div class="pninfo warn">⚠ ${esc(e.message||'AI仕分けに失敗しました')}</div>`; }
  finally{ _clsBusy=false; }
}
async function applyClassify(pns){
  let applied=0;
  for(let i=0;i<pns.length;i++){
    const cb=document.getElementById('cls_'+i); if(!cb||!cb.checked) continue;
    const cat=val('clsCat_'+i); if(!cat) continue;
    const t=await DB.get('tools', pns[i]); if(!t) continue;
    await DB.put('tools', {...t, category:cat, updatedAt:new Date().toISOString()});
    applied++;
  }
  toast(applied+'件を仕分けしました ✅');
  showAiSortBanner();
  doToolsList();
}
async function doToolsList(){
  const kw = (val('tl_kw')||'').toLowerCase();
  const cat = val('tl_cat'), shop = val('tl_shop'), sort = val('tl_sort')||'recent';
  const {byPn, toolMap} = await loadAll();
  let items = Object.entries(byPn).map(([pn,ps])=>aggregateTool(pn, ps, toolMap));
  items = items.filter(it=>{
    if(cat && (it.tool.category||'')!==cat) return false;
    if(shop && !it.st.sorted.some(p=>p.shop===shop)) return false;
    if(!kw) return true;
    return [it.pn, it.tool.name, it.tool.maker, it.tool.memo, it.tool.usage].some(f=>(f||'').toLowerCase().includes(kw));
  });
  const sorters = {
    recent:(a,b)=>(b.lastDate||'').localeCompare(a.lastDate||''),
    priceHigh:(a,b)=>(b.latestExcl||0)-(a.latestExcl||0),
    priceLow:(a,b)=>(a.latestExcl||0)-(b.latestExcl||0),
    amount:(a,b)=>b.totalAmount-a.totalAmount,
    qty:(a,b)=>b.totalQty-a.totalQty,
    name:(a,b)=>(a.tool.name||a.pn).localeCompare(b.tool.name||b.pn)
  };
  items.sort(sorters[sort]);
  const el = document.getElementById('tl_results');
  if(!items.length){ el.innerHTML='<div class="empty"><div class="em">🔍</div>該当する工具がありません</div>'; return; }
  el.innerHTML = `<h2 class="section">${items.length}件 <span style="font-weight:400">（単価は税別換算）</span></h2><div class="card" id="tl_rows"></div>`;
  const html = await Promise.all(items.map(async it=>{
    const url = await imageUrl(it.last && it.last.imageId);
    return `<a class="row" style="text-decoration:none;color:inherit" href="#/tool?pn=${encodeURIComponent(it.pn)}">
      ${url?`<img class="thumb" src="${url}">`:'<div class="thumb"></div>'}
      <div class="grow">
        <div class="pn">${esc(it.tool.name||it.pn)}</div>
        <div class="meta">${esc(it.pn)}${it.tool.maker?' ・ '+esc(it.tool.maker):''}${it.tool.category?' ・ '+esc(it.tool.category):''}</div>
        <div class="meta">最終 ${esc(it.lastDate)} ・ 累計${it.totalQty}個 ${yen(it.totalAmount)} ・ ${it.supplierCount}店</div>
      </div>
      <div style="text-align:right">
        <div class="price">${yen(it.latestExcl)}</div>
        ${it.cheapest?`<div class="meta" style="color:var(--down)">最安 ${esc(it.cheapest[0])}</div>`:''}
      </div>
    </a>`;
  }));
  document.getElementById('tl_rows').innerHTML = html.join('');
}

/* AI利用の概算費用を累計（meta 'aiUsage'） */
async function recordAiCost(meta){
  if(!meta || meta.costYen==null) return;
  const u = await getMeta('aiUsage', {count:0, totalYen:0});
  u.count++; u.totalYen = Math.round((u.totalYen + meta.costYen)*100)/100;
  await setMeta('aiUsage', u);
}
function costLabel(meta){
  if(!meta || meta.costYen==null) return '';
  const y = meta.costYen<1 ? meta.costYen.toFixed(2) : meta.costYen.toFixed(1);
  return `💰 この読み取り: 約${y}円（${esc(meta.model||meta.provider||'AI')}）`;
}
const AI_ENDPOINT = 'https://creating-visual-explainers-cyan.vercel.app/api/tool-ocr';
let _aiBusy = false;   // 二重送信防止

async function aiAnalyze(existingDraftId){
  if(_aiBusy) return;
  let blob = regState.imageBlob;
  if(existingDraftId){
    const d = await DB.get('ocrDrafts', existingDraftId);
    const im = d && await DB.get('images', d.imageId);
    blob = im && im.blob;
  }
  if(!blob){ toast('先に写真を選んでください'); return; }
  _aiBusy = true;
  const btn = document.getElementById('aiBtn') || document.getElementById('oc_reBtn');
  const orig = btn ? btn.textContent : '';
  if(btn){ btn.disabled = true; btn.innerHTML = '<span class="spin" style="display:inline-block;vertical-align:middle"></span> AI解析中…（10秒ほど）'; }
  try{
    const b64 = (await blobToBase64(blob)).split(',')[1];
    const [cats, sups] = await Promise.all([getCategories(), getSuppliers()]);
    const resp = await fetch(AI_ENDPOINT, {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({image:b64, mediaType:'image/jpeg', ocrText:regState.lastOcrText||'', categories:cats, suppliers:sups.map(x=>x.name)})});
    const data = await resp.json().catch(()=>({}));
    if(!resp.ok) throw new Error(data.error || 'AI解析に失敗しました');
    await recordAiCost(data.meta);
    let draftId = existingDraftId;
    if(draftId){
      const d = await DB.get('ocrDrafts', draftId);
      await DB.put('ocrDrafts', {...d, rawText:regState.lastOcrText||d.rawText, structuredResult:data, confidenceData:data.confidence||{}});
    }else{
      const imageId = await DB.put('images', {blob});
      draftId = await DB.put('ocrDrafts', {imageId, rawText:regState.lastOcrText||'', structuredResult:data,
        confidenceData:data.confidence||{}, status:'draft', createdAt:new Date().toISOString()});
    }
    formDirty = false;
    location.hash = '#/ocr-confirm?id='+draftId;
    if(existingDraftId) render();
  }catch(e){
    console.error(e);
    toast('⚠ '+(e.message||'AI解析に失敗しました。通常の読み取り・手入力で続けられます'));
  }finally{
    _aiBusy = false;
    if(btn){ btn.disabled = false; btn.textContent = orig; }
  }
}

function confClass(c){ return c==='high'?'conf-high':(c==='mid'?'conf-mid':'conf-low'); }
function confLabel(c){ return c==='high'?'<span class="confdot high"></span>':(c==='mid'?'<span class="confdot mid"></span>':'<span class="confdot low"></span>'); }
/* 旧形式（tool/purchase単品）の下書きを新形式（common/items）に変換 */
function normalizeDraftResult(sr){
  sr = sr||{};
  if(Array.isArray(sr.items) && sr.items.length) return sr;
  // 旧形式にはmetaが無い場合もある
  const t = sr.tool||{}, pu = sr.purchase||{}, c = sr.confidence||{};
  return {
    common:{supplier:pu.supplier||'', purchaseDate:pu.purchaseDate||'', taxType:pu.taxType||'不明', documentNumber:pu.documentNumber||'',
      confidence:{supplier:c.supplier||'low', purchaseDate:c.purchaseDate||'low', taxType:c.taxType||'low', documentNumber:c.documentNumber||'low'}},
    items:[{manufacturer:t.manufacturer||'', name:t.name||'', modelNumber:t.modelNumber||'', category:t.category||'', notes:t.notes||'',
      unitPrice:pu.unitPrice, quantity:pu.quantity,
      confidence:{manufacturer:c.manufacturer||'low', name:c.name||'low', modelNumber:c.modelNumber||'low', category:c.category||'low', notes:c.notes||'low', unitPrice:c.unitPrice||'low', quantity:c.quantity||'low'}}]
  };
}

function updateOcTotal(){
  const el=document.getElementById('oc_total'); if(!el) return;

    targets.push({i, pn, price, qty:Math.max(1,parseInt(val(`oc_${i}_quantity`),10)||1)});
  }
  if(!targets.length){ toast('保存する明細にチェックを入れてください'); return; }
  for(const t of targets){
    if(await isDuplicate(t.pn, purchaseDate, t.price)){
      if(!confirm(`明細${t.i+1}（${t.pn}）は同じ品番・同じ日・同じ価格の登録があります。追加しますか？`)) return;
    }
  }
  const now=new Date().toISOString();
  const supplierId=await supplierIdFor(shop);
  for(const t of targets){
    const maker=normalizeMaker(val(`oc_${t.i}_manufacturer`));
    const category=val(`oc_${t.i}_category`);
    const existing=await DB.get('tools', t.pn);
    await DB.put('tools', {

      name: val(`oc_${t.i}_name`)||(existing&&existing.name)||'',
      maker: maker||(existing&&existing.maker)||'',

      size:(existing&&existing.size)||'', material:(existing&&existing.material)||'',
      coating:(existing&&existing.coating)||'', usage:(existing&&existing.usage)||'',
      memo: val(`oc_${t.i}_notes`)||(existing&&existing.memo)||'',
      createdAt: existing?existing.createdAt:now, updatedAt: now
    });
    await DB.put('prices', {partNumber:t.pn, price:t.price, qty:t.qty, shop, supplierId,
      maker, category, memo:'', purchaseDate, imageId:d.imageId, createdAt:now,
      taxType, taxRate:10, documentNumber, sourceType:'ocr'});
    if(maker) await rememberSuggestion('maker', maker);
  }
  await DB.del('ocrDrafts', id);
  formDirty=false;
  toast(targets.length+'件の明細を保存しました ✅');
  location.hash = targets.length===1 ? '#/tool?pn='+encodeURIComponent(targets[0].pn) : '#/history';
}

/* ===================== CSV入出力 ===================== */
function csvEscape(v){
  v = String(v==null?'':v);
  return /[",\n\r]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v;
}
function downloadCsv(filename, rows){
  const text = '﻿' + rows.map(r=>r.map(csvEscape).join(',')).join('\r\n');  // BOM付きUTF-8（Excel対応）
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], {type:'text/csv'}));
  a.download = filename; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 5000);
}
/* 引用符対応の簡易CSVパーサ */
function parseCsv(text){
  const rows=[]; let row=[], cur='', inQ=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(inQ){
      if(c==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else inQ=false; }
      else cur+=c;
    }else{
      if(c==='"') inQ=true;
      else if(c===','){ row.push(cur); cur=''; }
      else if(c==='\n'||c==='\r'){ if(c==='\r'&&text[i+1]==='\n')i++; row.push(cur); rows.push(row); row=[]; cur=''; }
      else cur+=c;
    }
  }
  if(cur!==''||row.length){ row.push(cur); rows.push(row); }
  return rows.filter(r=>r.some(c=>c!==''));
}

/* 購入履歴CSV取込: 文字コード自動判別→プレビュー→エラー行/重複表示→確定 */
let _csvRows = null;
async function previewCsvImport(input){
  const file = input.files[0]; input.value=''; if(!file) return;
  const buf = await file.arrayBuffer();
  let text = new TextDecoder('utf-8', {fatal:false}).decode(buf);
  if(text.includes('�')) text = new TextDecoder('shift_jis').decode(buf);   // 文字化けならShift_JISで再試行
  text = text.replace(/^﻿/,'');
  const rows = parseCsv(text);
  if(rows.length<2){ toast('データ行がありません'); return; }
  const header = rows[0];
  const idx = n => header.indexOf(n);
  const col = {pn:idx('品番'), date:idx('購入日'), shop:idx('工具屋'), price:idx('単価'), qty:idx('個数'), tax:idx('税区分'), doc:idx('伝票番号'), memo:idx('メモ')};
  if(col.pn<0 || col.price<0){ toast('ヘッダーに「品番」「単価」が必要です'); return; }
  const existing = await DB.getAll('prices');
  const checked = rows.slice(1).map((r,i)=>{
    const pn=(r[col.pn]||'').trim();
    const price=parseFloat(String(r[col.price]||'').replace(/[,¥\s]/g,''));
    const date=(col.date>=0?r[col.date]:'').trim()||new Date().toISOString().slice(0,10);
    const qty=Math.max(1,parseInt(col.qty>=0?r[col.qty]:'1',10)||1);
    const errs=[];
    if(!pn) errs.push('品番なし');
    if(!(price>=0)) errs.push('単価が数値でない');
    if(date && !/^\d{4}[-\/]\d{1,2}[-\/]\d{1,2}$/.test(date)) errs.push('日付形式が不正');
    const normDate = date.replace(/\//g,'-');
    const dup = existing.some(p=>p.partNumber===pn && p.purchaseDate===normDate && p.price===price);
    return {line:i+2, pn, price, qty, date:normDate, shop:(col.shop>=0?r[col.shop]:'').trim(),
      tax:(col.tax>=0?r[col.tax]:'').trim()||'税別', doc:(col.doc>=0?r[col.doc]:'').trim(), memo:(col.memo>=0?r[col.memo]:'').trim(),
      errs, dup};
  });
  _csvRows = checked;
  const okCount = checked.filter(r=>!r.errs.length).length;
  const el = document.getElementById('csvPreview');
  el.innerHTML = `
    <h3 style="margin:14px 0 6px;font-size:15px">取込プレビュー（${checked.length}行中 ${okCount}行 取込可能）</h3>
    <div style="max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:10px">
      ${checked.map(r=>`<div style="padding:8px 12px;border-bottom:1px solid var(--line);font-size:13px;${r.errs.length?'background:#fef2f2':''}">
        <b>${r.line}行目</b> ${esc(r.pn)||'—'} ／ ${esc(r.date)} ／ ${isFinite(r.price)?yen(r.price):'—'} ×${r.qty} ／ ${esc(r.shop)||'-'}
        ${r.errs.length?`<span style="color:var(--up);font-weight:700"> ⚠ ${r.errs.join('・')}</span>`:''}
        ${r.dup?'<span style="color:#92400e;font-weight:700"> ⚠ 既存と重複の可能性</span>':''}
      </div>`).join('')}
    </div>
    <button class="btn block" style="margin-top:10px" onclick="commitCsvImport()">✅ ${okCount}行を取り込む（エラー行はスキップ）</button>
    <button class="btn gray block" style="margin-top:8px" onclick="_csvRows=null;document.getElementById('csvPreview').innerHTML=''">キャンセル</button>`;
}
async function commitCsvImport(){
  if(!_csvRows) return;
  const ok = _csvRows.filter(r=>!r.errs.length);
  if(!ok.length){ toast('取り込める行がありません'); return; }
  const now = new Date().toISOString();
  let added=0;
  for(const r of ok){
    if(!(await DB.get('tools', r.pn)))
      await DB.put('tools', {partNumber:r.pn, name:'', maker:'', category:'', size:'', material:'', coating:'', usage:'', memo:'', createdAt:now, updatedAt:now});
    if(r.shop && !(await supplierByName(r.shop))){
      await DB.put('suppliers', {name:r.shop, contactPerson:'', phone:'', email:'', address:'', paymentTerms:'', closingDay:'', paymentDay:'', website:'', notes:'', createdAt:now, updatedAt:now});
    }
    await DB.put('prices', {partNumber:r.pn, price:r.price, qty:r.qty, shop:r.shop, supplierId:await supplierIdFor(r.shop),
      maker:'', category:'', memo:r.memo, purchaseDate:r.date, imageId:null, createdAt:now,
      taxType:['税込','税別','不明'].includes(r.tax)?r.tax:'税別', taxRate:10, documentNumber:r.doc, sourceType:'csv'});
    added++;
  }
  _csvRows=null; document.getElementById('csvPreview').innerHTML='';
  toast(added+'行を取り込みました ✅');
  render();
}

/* ---------- バックアップ（写真はbase64で内包） ---------- */
function blobToBase64(blob){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(blob); }); }
async function base64ToBlob(dataUrl){ return await (await fetch(dataUrl)).blob(); }

async function exportData(){
  try{
    toast('書き出し中…');
    const [tools, prices, images, meta, suppliers, ocrDrafts] = await Promise.all(
      ['tools','prices','images','meta','suppliers','ocrDrafts'].map(s=>DB.getAll(s)));
    const imgs = [];
    for(const im of images){ imgs.push({id: im.id, data: await blobToBase64(im.blob)}); }
    const payload = {app:'kouguhi-kurabe', version:2, exportedAt:new Date().toISOString(), tools, prices, images:imgs, meta, suppliers, ocrDrafts};
    const blob = new Blob([JSON.stringify(payload)], {type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'kouguhi-backup-' + new Date().toISOString().slice(0,10) + '.json';
    a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href), 10000);
    toast('バックアップを保存しました ✅');
  }catch(e){ console.error(e); toast('書き出しに失敗しました'); }
}

async function importData(input){
  const file = input.files[0]; input.value=''; if(!file) return;
  try{
    const data = JSON.parse(await file.text());
    if(data.app!=='kouguhi-kurabe' || !Array.isArray(data.prices)){ toast('このアプリのバックアップファイルではありません'); return; }
    const when = (data.exportedAt||'').slice(0,10) || '不明';
    if(!confirm(`バックアップを読み込みます（${when} 保存 / ${data.prices.length}件）。\n今のデータはすべて置き換わります。よろしいですか？`)) return;
    toast('読み込み中…');
    for(const s of ['tools','prices','images','meta','suppliers','ocrDrafts']) await DB.clear(s);
    _urlCache.forEach(u=>URL.revokeObjectURL(u)); _urlCache.clear();
    for(const t of data.tools||[]) await DB.put('tools', t);
    for(const p of data.prices||[]) await DB.put('prices', p);
    for(const im of data.images||[]) await DB.put('images', {id: im.id, blob: await base64ToBlob(im.data)});
    for(const m of data.meta||[]) await DB.put('meta', m);
    for(const sp of data.suppliers||[]) await DB.put('suppliers', sp);
    for(const od of data.ocrDrafts||[]) await DB.put('ocrDrafts', od);
    await migrateV2();   // v1バックアップならここでv2形式に変換される（v2なら何もしない）
    toast('復元しました ✅');
    location.hash = '#/home'; render();
  }catch(e){ console.error(e); toast('読み込みに失敗しました'); }
}

/* ---------- サンプルデータ削除 ---------- */
const SAMPLE_PNS = ['A640-2','CCMT09T308','EX-SUS-M8','VQMHZVD0800','BT40-SLA12','CD-15'];
function isSamplePrice(p){ return p.sample===true || SAMPLE_PNS.includes(p.partNumber); }
async function deleteSampleData(){
  const prices = await DB.getAll('prices');
  const targets = prices.filter(isSamplePrice);
  if(!targets.length){ toast('サンプルデータはありません'); return; }
  if(!confirm(`サンプルデータ ${targets.length}件を削除します。\n（サンプル品番 ${SAMPLE_PNS.join(', ')} の登録が対象）\nよろしいですか？`)) return;
  for(const p of targets){
    await DB.del('prices', p.id);
  }
  for(const p of targets){ await safeDeleteImage(p.imageId, p.id); }
  for(const pn of new Set(targets.map(p=>p.partNumber))) await cleanupTool(pn);
  toast('サンプルを削除しました ✅');
  render();
}

  for(const [pn,category,maker,shop,price,offset] of samples){
    // 1x1 透明pngをダミー画像に
